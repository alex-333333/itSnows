name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release -p itsnows
      - uses: actions/upload-artifact@v4
        with:
          name: itsnows-windows-x64
          path: target/release/itsnows.exe
          if-no-files-found: error
